name: Order Flow Test
steps:
  # Authenticate
  - $ref: ../steps/login.yml

  # Create a product to order
  - $ref: ../steps/create-product.yml

  # Create an order for the product
  - $ref: ../steps/create-order.yml

  # Check the order status
  - $ref: ../steps/get-order-status.yml

  # Wait a bit before checking again (simulate processing time)
  - name: Wait for order processing
    delay: 1000

  # Check order status again
  - name: Verify Order Still Exists
    http:
      url: https://api.example.com/orders/${{ captures.orderId }}
      method: GET
      headers:
        Authorization: Bearer ${{ captures.authToken }}
      check:
        status: 200
        jsonpath:
          $.orderId:
            - eq: ${{ captures.orderId }}

  # Clean up: Delete the test product
  - $ref: ../steps/delete-product.yml
