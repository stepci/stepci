name: Get Product Details
http:
  url: https://api.example.com/products/${{ captures.newProductId }}
  method: GET
  headers:
    Authorization: Bearer ${{ captures.authToken }}
  check:
    status: 200
    jsonpath:
      $.id:
        - eq: ${{ captures.newProductId }}
      $.name:
        - isString: true
      $.price:
        - isNumber: true
      $.stock:
        - gte: 0
